
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FastMoney</title>
    <meta name="description" content="Gerencie suas contas e finanças com facilidade" />
    <meta name="author" content="Lovable" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FastMoney" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FastMoney" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    
    <!-- Para iOS específico -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-152x152.png" />
    
    <!-- Smart App Banners -->
    <meta name="apple-itunes-app" content="app-id=myAppStoreID">
    
    <!-- Safari Web App -->
    <link rel="mask-icon" href="/icons/icon-192x192.png" color="#3b82f6">
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove qualquer service worker antigo que possa interceptar requisições.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister());
          });
        });
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwaInstallable'));
      });

      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwaInstalled'));
      });

      if (window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true) {
        document.documentElement.classList.add('pwa-mode');
      }
    </script>

  </body>
</html>
